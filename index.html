/* Registered script block ordering and insertion controls */
.block-item{position:relative;gap:5px;align-items:flex-start;transition:background-color .1s}
.block-item .block-body{min-width:0}
.block-drag{display:inline-flex;align-items:center;justify-content:center;align-self:stretch;flex:0 0 13px;cursor:grab;color:#977052;font-size:16px;user-select:none;touch-action:none}
.block-drag:active{cursor:grabbing}
.block-item .block-controls{display:flex;gap:3px;align-items:center;flex:0 0 auto}
.block-item .block-controls button{height:26px;min-width:24px;padding:2px 4px;font-size:12px;line-height:1;border:1px solid #d3ae85;border-radius:5px}
.block-item .block-controls button.edit-block{padding:2px 6px}
.block-item .block-controls .position-btn.is-active{color:#fff0d0;background:#754426;border-color:#66351d;box-shadow:0 0 0 2px #f3c887}
.block-item .block-controls button:hover{background:#f2c98c}
.block-item .block-controls .position-btn.is-active:hover{background:#754426}
.block-item.block-drag-before{box-shadow:inset 0 4px #a36536;background:#fff2d9}
.block-item.block-drag-after{box-shadow:inset 0 -4px #a36536;background:#fff2d9}
.block-item.block-insertion-target{border-color:#bf8759}
.block-insert-help{font-size:11px;line-height:1.45;color:#765239;margin-top:6px}
.block-insert-help.has-target{font-weight:800;color:#7b3f20}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><img class="ico title-icon" src="assets/アイコン：シーン構成.png" alt="">CineScript Pro <small>｜ 映像作品制作支援ツール</small></div>
  <nav class="topnav"><button data-action="openHome"><img class="ico" src="assets/アイコン：ホーム.png" alt="">ホーム</button><button data-action="openHome"><img class="ico" src="assets/アイコン：台詞、ト書き.png" alt="">プロジェクト</button></nav>
  <span class="save-status" id="saveStatus">読込中…</span>
</header>
<div class="commandbar">
  <div class="mode-title" id="headerMode">絵コンテモード</div>
  <input class="name-field" id="projectName" aria-label="プロジェクト名" placeholder="作品名を入力" maxlength="100">
  <select id="sceneSelect" aria-label="シーン選択"></select>
  <button class="btn filebtn" id="undoBtn" data-action="undo" title="Ctrl+Z"><img class="ico" src="assets/アイコン：アンドゥ.png" alt="">Undo (戻す)</button>
  <button class="btn filebtn" id="redoBtn" data-action="redo" title="Ctrl+Y"><img class="ico" src="assets/アイコン：リドゥ 2.png" alt="">Redo (やり直す)</button>
  <div class="spacer"></div>
  <button class="btn filebtn" data-action="saveJson">{ } JSON保存</button>
  <button class="btn filebtn" data-action="loadJson"><img class="ico" src="assets/アイコン：フォルダー.png" alt="">JSON読込</button>
  <button class="btn filebtn" data-action="exportPsd">PSDセット</button>
  <button class="btn filebtn" data-action="exportHtml">HTMLダウンロード</button>
  <button class="btn filebtn" data-action="exportTxt">TXTダウンロード</button>
</div>
<div class="workspace">
  <aside class="panel left-panel"><div class="panelhead"><img class="ico" src="assets/アイコン：プロット.png">プロット</div><div class="left-scroll">
    <div class="paper"><img class="corner-icon" src="assets/クリップ.png"><h3><img class="ico" src="assets/カップ.png" alt="">作品のあらすじ</h3><textarea id="summaryInput" placeholder="作品のあらすじ・テーマを入力…" aria-label="作品のあらすじ"></textarea></div>
    <div class="section-title"><img class="ico" src="assets/アイコン：シーン構成.png">シーン構成（プロット）</div><div id="sceneList"></div>
    <button class="btn mini full" data-action="addScene">＋ シーンを追加</button>
    <div class="section-title" style="margin-top:15px"><img class="ico" src="assets/アイコン：シーン構成.png">カット（選択中シーン）</div><div id="sideCutList" class="cut-list"></div>
    <div class="paper memo"><img class="memo-pin" src="assets/アイコン：メモ　チョコレート.png"><h3>📌 メモ</h3><textarea id="memoInput" placeholder="構成メモ、演出のアイデア、備忘録など…" aria-label="メモ"></textarea></div>
  </div></aside>
  <main class="panel editor-panel">
    <div class="editor-toolbar">
      <div class="mode-switch"><button class="btn" id="storyModeBtn" data-action="storyMode"><img class="ico" src="assets/アイコン：シーン構成.png">絵コンテモード</button><button class="btn" id="canvasModeBtn" data-action="canvasMode"><img class="ico" src="assets/アイコン：ペンツール.png">キャンバスモード</button></div>
      <div class="spacer"></div>
      <div class="toolbar-zoom"><button class="btn mini iconbtn imgbtn" data-action="zoomOut" title="縮小"><img class="ico" src="assets/アイコン：ビュースライダー　縮小.png" alt=""></button><input type="range" id="zoomSlider" min="25" max="160" value="75" step="5" aria-label="キャンバス拡大率"><button class="btn mini iconbtn imgbtn" data-action="zoomIn" title="拡大"><img class="ico" src="assets/アイコン：ビュースライダー　拡大.png" alt=""></button><button class="btn mini" id="zoomLabel" data-action="fitCanvas">75%</button><button class="btn mini iconbtn" data-action="fitCanvas" title="画面にフィット"><img class="ico" src="assets/アイコン：プレビュー　フィット用.png" alt=""></button></div>
    </div>
    <div id="storyRegion" style="display:flex;flex-direction:column;min-height:0;flex:1">
      <div class="view-pills"><button class="btn mini" data-view="all">▦ 絵コンテ一覧</button><button class="btn mini" data-view="image">▣ サムネイルのみ</button><button class="btn mini" data-view="text">☷ 台詞・ト書きのみ</button><span class="count-line" id="boardCount"></span></div>
      <div class="story-body" id="storyBody"></div>
      <div class="story-footer"><img src="assets/カットを追加ボタン　左装飾.png"><button class="btn add-cut" data-action="addCut">＋ カットを追加</button><img src="assets/カットを追加ボタン右装飾.png"></div>
    </div>
    <div class="canvas-region" id="canvasRegion">
      <div class="canvas-top"><button class="btn mini iconbtn" data-action="prevCut">❮</button><span id="canvasCutName">シーン1 / カット1</span><button class="btn mini iconbtn" data-action="nextCut">❯</button><span class="count-line" id="canvasCount">現在の文字数：0文字 / およそ0分</span></div>
      <div class="draw-area"><div class="tool-rail" id="toolRail"></div><div class="canvas-scroll" id="canvasScroll"><div class="canvas-stage" id="canvasStage"><canvas id="renderCanvas" width="960" height="540"></canvas><canvas id="interactionCanvas" width="960" height="540"></canvas></div></div></div>
      <div class="canvas-caption">ペン入力・筆圧に対応 ／ 描画はラスターレイヤーに保存されます</div>
      <div class="canvas-script-bottom"><div class="script-box"><div class="box-title"><img class="ico" src="assets/アイコン：ト書き.png">ト書き（カットの説明）</div><div id="canvasActionText" class="box-content" data-action="showInput">ト書きはまだありません</div></div><div class="script-box"><div class="box-title"><img class="ico" src="assets/アイコン：ふきだし.png">台詞（キャラクターのセリフ）</div><div id="canvasDialogueText" class="box-content" data-action="showInput">台詞はまだありません</div></div></div>
      <div class="canvas-bottom-nav"><button class="btn" data-action="prevCut">❮ 前のカット</button><button class="btn" data-action="nextCut">次のカット ❯</button></div>
    </div>
  </main>
  <aside class="panel right-panel"><div class="tabbar" id="rightTabs"></div><div class="right-body" id="rightBody"></div></aside>
</div>
<div class="modal-shade" id="modalShade"><div class="modal" id="modalContent"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="projectFile" accept=".json,application/json" hidden>
<input type="file" id="imageFile" accept="image/png,image/jpeg,image/webp" hidden>
<script>
'use strict';
const CW=960,CH=540;
const ICONS={plot:'アイコン：プロット.png',scene:'アイコン：シーン構成.png',pen:'アイコン：ペンツール.png',eraser:'アイコン：消しゴム.png',hand:'アイコン：ハンドツール.png',picker:'アイコン：スポイト.png',layer:'アイコン：レイヤー.png',action:'アイコン：ト書き.png',dialogue:'アイコン：ふきだし.png',settings:'アイコン：歯車.png',move:'アイコン：移動.png',pressure:'アイコン：筆圧.png',folder:'アイコン：フォルダー.png',home:'アイコン：ホーム.png',project:'アイコン：台詞、ト書き.png',fit:'アイコン：プレビュー　フィット用.png',zoomIn:'アイコン：ビュースライダー　拡大.png',zoomOut:'アイコン：ビュースライダー　縮小.png',undo:'アイコン：アンドゥ.png',redo:'アイコン：リドゥ 2.png',eye:'レイヤー表示状態.png',eyeOff:'レイヤー非表示状態.png',lock:'レイヤーロック.png',unlock:'レイヤーロック解除.png',title:'アイコン：シーン構成.png',cup:'カップ.png'};
const icon=(kind,dark=false)=>`<img class="ico${dark?' dark':''}" src="assets/${ICONS[kind]||kind}" alt="">`;
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const defaultLayerNames=['線画','ラフ','下描き（アタリ）','背景'];
const makeLayer=(name)=>({id:uid(),name,visible:true,locked:false,png:''});
const makeCut=()=>({id:uid(),name:'',duration:15,blocks:[],layers:defaultLayerNames.map(makeLayer),thumb:''});
const makeScene=(n=1)=>({id:uid(),title:`シーン${n}`,description:'',cuts:[makeCut()]});
function newProject(){const s=makeScene();return {version:2,id:uid(),name:'新しい作品',summary:'',notes:'',scenes:[s],characters:[],activeSceneId:s.id,activeCutId:s.cuts[0].id,selectedLayerId:s.cuts[0].layers[0].id,mode:'story',sideTab:'input',tool:'pen',view:'all',brushColor:'#6e3e29',brushSize:12,brushOpacity:100,pressure:true,stabilizerEnabled:true,stabilizerStrength:40,zoom:75,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};}
let state=newProject();let ui={draftType:'action',draftText:'',selectedCharId:null,editBlockId:null,insertAnchorId:null,insertWhere:null,blockDragId:null,collapsedScenes:new Set(),undo:[],redo:[],layerCanvases:new Map(),loadingStamp:0,activeLoadedCut:null,painting:null,dragId:null,saveTimer:null,toastTimer:null,db:null,saving:false,h:18,s:65,v:42};
function getScene(){return state.scenes.find(s=>s.id===state.activeSceneId)||state.scenes[0];}
function getCut(){return getScene()?.cuts.find(c=>c.id===state.activeCutId)||getScene()?.cuts[0];}
function cutIndex(cutId){let found=null;state.scenes.forEach(s=>s.cuts.forEach((c,i)=>{if(c.id===cutId)found={scene:s,cut:c,index:i}}));return found;}
function scriptLine(block){const txt=String(block.text||'').trim();if(!txt)return '';if(block.type==='action')return '// '+txt.replace(/^\/\/\s*/, '');const ch=state.characters.find(c=>c.id===block.characterId);return (ch?.name||'未登録キャラクター')+':'+txt;}
function allChars(){return state.scenes.reduce((n,s)=>n+s.cuts.reduce((m,c)=>m+c.blocks.reduce((p,b)=>p+scriptLine(b).length,0),0),0);}
function estimateMinutes(){const n=allChars();return n===0?0:Math.ceil(n/240);}
const countText=()=>`現在の文字数：${allChars().toLocaleString('ja-JP')}文字 / およそ${estimateMinutes()}分`;
function sceneCutName(s,c){return `${s.title} / カット${s.cuts.indexOf(c)+1}`;}
function cleanFile(n){return String(n||'CineScript').replace(/[\\/:*?"<>|\x00-\x1F]/g,'_').slice(0,70);}
function findCutById(id){for(const s of state.scenes){const c=s.cuts.find(c=>c.id===id);if(c)return {scene:s,cut:c};}return null;}
function toast(s){const x=$('#toast');x.textContent=s;x.classList.add('visible');clearTimeout(ui.toastTimer);ui.toastTimer=setTimeout(()=>x.classList.remove('visible'),2600);}
function markDirty(){state.updatedAt=new Date().toISOString();$('#saveStatus').textContent='● 保存中…';clearTimeout(ui.saveTimer);ui.saveTimer=setTimeout(saveLocal,750);}
function renderHeader(){const sc=getScene();$('#projectName').value=state.name;$('#summaryInput').value=state.summary;$('#memoInput').value=state.notes;$('#headerMode').textContent=state.mode==='story'?'絵コンテモード':'キャンバスモード';$('#sceneSelect').innerHTML=state.scenes.map(s=>`<option value="${esc(s.id)}" ${s.id===sc.id?'selected':''}>${esc(s.title)}（${s.cuts.length}カット）</option>`).join('');$('#storyModeBtn').classList.toggle('active',state.mode==='story');$('#canvasModeBtn').classList.toggle('active',state.mode==='canvas');$('#zoomSlider').value=state.zoom;$('#zoomLabel').textContent=`${state.zoom}%`;$('#undoBtn').disabled=ui.undo.length===0;$('#redoBtn').disabled=ui.redo.length===0;$('#boardCount').textContent=countText();$('#canvasCount').textContent=countText();$('#storyRegion').style.display=state.mode==='story'?'flex':'none';$('#canvasRegion').style.display=state.mode==='canvas'?'flex':'none';}
function renderLeft(){let sceneHtml='';for(const [si,s]of state.scenes.entries()){const selected=s.id===state.activeSceneId;const collapsed=ui.collapsedScenes.has(s.id);sceneHtml+=`<div class="scene-line ${selected?'selected':''}" data-scene="${s.id}"><div class="scene-title"><button data-action="toggleScene" data-id="${s.id}">${collapsed?'▶':'▼'}</button><div class="title-text" data-action="chooseScene" data-id="${s.id}" title="クリックしてシーンを選択">${esc(s.title)}</div><button data-action="sceneOptions" data-id="${s.id}" title="シーン編集">✎</button></div>${!collapsed?`<div class="scene-description">${esc(s.description||'（シーンの説明は未入力）')}</div>`:''}</div>`;}
$('#sceneList').innerHTML=sceneHtml;
const sc=getScene();$('#sideCutList').innerHTML=sc.cuts.map((c,i)=>`<div class="side-cut ${c.id===state.activeCutId?'active':''}" data-cut="${c.id}" draggable="true"><span class="drag-handle" title="ドラッグして並び替え">⠿</span><img class="thumb" src="${c.thumb||blankSvg()}" alt="カット${i+1}のサムネイル"><span class="cut-name" data-action="selectCut" data-id="${c.id}">カット${i+1}<br><span class="tiny">約${c.duration}秒</span></span><span class="cut-actions"><button class="btn mini icon-only" data-action="openCanvas" data-id="${c.id}" title="キャンバスを編集">${icon('pen',c.id===state.activeCutId)}</button></span></div>`).join('');}
function blankSvg(){return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="480" height="270"><rect width="480" height="270" fill="#fff8ed"/><text x="240" y="142" font-size="18" text-anchor="middle" fill="#cbb59d">クリックして作画</text></svg>');}
function renderStoryboard(){const sc=getScene();$('#storyBody').innerHTML=sc.cuts.map((c,i)=>{const blocks=c.blocks.map(b=>`<div class="${b.type==='action'?'line-action':'line-dialogue'}">${esc(scriptLine(b))}</div>`).join('');const card=`<article class="story-card ${c.id===state.activeCutId?'active':''}" draggable="true" data-cut="${c.id}"><div class="drag-handle" title="ドラッグしてカットを並び替え">⠿</div><div class="cut-thumb" data-action="openCanvas" data-id="${c.id}"><img src="${c.thumb||blankSvg()}" alt="カット${i+1}の絵コンテ"><span class="cut-number">カット${i+1}</span><span class="edit-mark">✎</span></div><div class="cut-script" data-action="openScript" data-id="${c.id}"><div class="cut-meta"><span class="tiny">${esc(c.name||'')}</span><span>◷ 約${c.duration}秒 <button class="more" data-action="cutOptions" data-id="${c.id}" title="カット設定">•••</button></span></div><div class="script-sheet">${blocks||'<span class="blank-hint">ここに台詞・ト書きが表示されます。<br>右のテキスト入力から追加してください。</span>'}</div></div></article>`;return state.view==='image'?card.replace('class="cut-script"','class="cut-script hidden"'):state.view==='text'?card.replace('class="cut-thumb"','class="cut-thumb hidden"'):card;}).join('');$('#storyBody').dataset.view=state.view;$('#storyBody').querySelectorAll('.story-card').forEach(card=>{if(state.view==='image')card.style.gridTemplateColumns='22px minmax(0,1fr)';if(state.view==='text')card.style.gridTemplateColumns='22px minmax(0,1fr)';});document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view));}
function renderCanvasInfo(){const sc=getScene(),cut=getCut();if(!cut)return;$('#canvasCutName').textContent=sceneCutName(sc,cut);const actions=cut.blocks.filter(b=>b.type==='action').map(scriptLine).join('\n\n');const dialogue=cut.blocks.filter(b=>b.type==='dialogue').map(scriptLine).join('\n\n');$('#canvasActionText').textContent=actions||'ト書きはまだありません。クリックして追加';$('#canvasDialogueText').textContent=dialogue||'台詞はまだありません。クリックして追加';$('#canvasCount').textContent=countText();$('#boardCount').textContent=countText();}
function renderTools(){const arr=[['pen','ペン'],['eraser','消しゴム'],['hand','ハンド'],['picker','スポイト']];$('#toolRail').innerHTML=arr.map(([v,t])=>`<button class="btn ${state.tool===v?'active':''}" data-action="tool" data-value="${v}" title="${t}">${icon(v,state.tool===v)}</button>`).join('');$('#interactionCanvas').style.cursor=state.tool==='hand'?'grab':state.tool==='picker'?'copy':state.tool==='eraser'?'cell':'crosshair';}
function renderRight(){const canvas=state.mode==='canvas';const tabs=canvas?[['input','テキスト入力','action'],['layers','レイヤー','layer'],['tools','ツール設定','settings']]:[['input','テキスト入力','action'],['cut','カット設定','settings'],['characters','キャラクター管理','dialogue']];if(!tabs.some(t=>t[0]===state.sideTab))state.sideTab='input';$('#rightTabs').innerHTML=tabs.map(([v,t,ic])=>`<button class="btn ${state.sideTab===v?'active':''}" data-action="sideTab" data-value="${v}">${icon(ic,state.sideTab===v)}${t}</button>`).join('');const el=$('#rightBody');if(state.sideTab==='input')el.innerHTML=inputPanel();if(state.sideTab==='layers')el.innerHTML=layersPanel();if(state.sideTab==='tools')el.innerHTML=toolsPanel();if(state.sideTab==='cut')el.innerHTML=cutPanel();if(state.sideTab==='characters')el.innerHTML=charactersPanel();if(state.sideTab==='tools')setupWheel();}
function inputPanel(){const cut=getCut();const chars=state.characters;const selected=chars.find(c=>c.id===ui.selectedCharId)||chars[0];const anchorIndex=cut.blocks.findIndex(b=>b.id===ui.insertAnchorId);
if(anchorIndex<0){ui.insertAnchorId=null;ui.insertWhere=null;}
const anchor=anchorIndex>=0?cut.blocks[anchorIndex]:null;
const insertionHint=anchor?`挿入位置：${anchorIndex+1}番「${esc(scriptLine(anchor).slice(0,15))}${scriptLine(anchor).length>15?'…':''}」の${ui.insertWhere==='before'?'上':'下'}`:'挿入位置：一番下（末尾）';
const cutBlocks=cut.blocks.map((b,i)=>`<div class="block-item ${ui.insertAnchorId===b.id?'block-insertion-target':''}" data-block="${b.id}"><span class="block-drag" draggable="true" data-block-drag="${b.id}" title="ドラッグでテキストを並び替え" aria-label="テキストをドラッグして並び替え">⠿</span><div class="block-body"><div class="name">${i+1}. ${b.type==='action'?'ト書き':esc(state.characters.find(x=>x.id===b.characterId)?.name||'未登録キャラ')}</div>${esc(scriptLine(b))}</div><div class="block-controls"><button class="position-btn ${ui.insertAnchorId===b.id&&ui.insertWhere==='before'?'is-active':''}" data-action="setInsertPosition" data-id="${b.id}" data-value="before" title="このテキストの上に新規追加（再クリックで解除）" aria-pressed="${ui.insertAnchorId===b.id&&ui.insertWhere==='before'}">↑</button><button class="position-btn ${ui.insertAnchorId===b.id&&ui.insertWhere==='after'?'is-active':''}" data-action="setInsertPosition" data-id="${b.id}" data-value="after" title="このテキストの下に新規追加（再クリックで解除）" aria-pressed="${ui.insertAnchorId===b.id&&ui.insertWhere==='after'}">↓</button><button class="edit-block" data-action="editBlock" data-id="${b.id}">編集</button><button data-action="deleteBlock" data-id="${b.id}" title="削除">×</button></div></div>`).join('');return `<div class="side-section"><h3><span>${icon('action')}入力の種類</span></h3><div class="light-panel"><div class="radio-row"><label class="radio-option"><input type="radio" name="scriptType" value="action" ${ui.draftType==='action'?'checked':''}>ト書き</label><label class="radio-option"><input type="radio" name="scriptType" value="dialogue" ${ui.draftType==='dialogue'?'checked':''}>台詞</label></div><p class="help-text">${ui.draftType==='action'?'入力時に「// + 半角空白」が自動で付与されます。':'「キャラクター名:台詞」の形式になります。'}</p>${ui.draftType==='dialogue'?`<div class="radio-row">${chars.map(c=>`<label class="radio-option"><input type="radio" name="speaker" value="${c.id}" ${c.id===selected?.id?'checked':''}><span class="color-square" style="background:${esc(c.color)}"></span>${esc(c.name)}</label>`).join('')||'<span class="help-text">先にキャラクターを登録してください。</span>'}</div><button class="btn mini" data-action="addCharacter">＋ キャラクターを登録</button>`:''}</div></div>
<div class="side-section"><h3><span>${icon('dialogue')} ${ui.editBlockId?'ブロックを編集':'テキストを追加'}</span><span class="tiny">${esc(sceneCutName(getScene(),cut))}</span></h3><div class="light-panel"><textarea id="composer" placeholder="${ui.draftType==='action'?'例：教室の窓に夕日が差し込む。':'例：久しぶり！'}" spellcheck="false">${esc(ui.draftText)}</textarea><div class="list-actions"><button class="btn light" data-action="insertBlock" ${ui.draftType==='dialogue'&&!chars.length?'disabled':''}>${ui.editBlockId?'✓ 変更を反映':anchor?'＋ 指定位置に追加':'＋ このカットに追加'}</button><button class="btn light mini" data-action="cancelEdit">${ui.editBlockId?'キャンセル':'クリア'}</button></div>${!ui.editBlockId?`<div class="block-insert-help ${anchor?'has-target':''}">${insertionHint} / ↑↓を再クリックで解除</div>`:''}</div></div>
<div class="side-section"><h3><span>${icon('action')}登録したテキスト（${cut.blocks.length}件）</span></h3>${cutBlocks||'<div class="info">まだテキストがありません。</div>'}</div><div class="current-count">${countText().replace(/(\d[\d,]*文字)/,'<strong>$1</strong>')}</div><div class="info">文字数から240字＝1分として計算。端数は1分単位で切り上げます。</div>`;}

function layer(){return getCut()?.layers.find(l=>l.id===state.selectedLayerId);}
function pointFromEvent(e){const r=$('#interactionCanvas').getBoundingClientRect();return {x:Math.max(0,Math.min(CW,(e.clientX-r.left)*CW/r.width)),y:Math.max(0,Math.min(CH,(e.clientY-r.top)*CH/r.height)),p:state.pressure&&e.pointerType==='pen'?Math.max(.12,e.pressure||.5):1};}
// Draw each pen segment as a round-ended continuous stroke rather than spaced circle stamps.
// This prevents the scalloped/lumpy edge that was especially visible with large brushes.
function plotCircle(ctx,x,y,pressure,size=state.brushSize){const r=Math.max(.5,size*pressure/2);ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();}
function paintSegment(ctx,a,b,size=state.brushSize){const dx=b.x-a.x,dy=b.y-a.y;const dist=Math.hypot(dx,dy);if(dist<.001)return;
 const r0=Math.max(.5,size*a.p/2),r1=Math.max(.5,size*b.p/2);

 if(Math.abs(r0-r1)<.05){ctx.lineWidth=r0*2;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();return;}

 const nx=-dy/dist,ny=dx/dist;
 ctx.beginPath();ctx.moveTo(a.x+nx*r0,a.y+ny*r0);ctx.lineTo(b.x+nx*r1,b.y+ny*r1);ctx.lineTo(b.x-nx*r1,b.y-ny*r1);ctx.lineTo(a.x-nx*r0,a.y-ny*r0);ctx.closePath();ctx.fill();

// A speed-adaptive low-pass filter that smooths tablet and mouse jitter.
// The current stroke keeps its own settings, so changing the UI while drawing
// cannot break pressure interpolation or undo history.
function smoothStrokePoint(stroke,raw){
  const old=stroke.lastRaw||stroke.prev;
  stroke.lastRaw=raw;
  if(!stroke.stabilizerEnabled||stroke.stabilizerStrength<=0)return raw;
  const strength=stroke.stabilizerStrength/100;
  const travel=Math.hypot(raw.x-old.x,raw.y-old.y);
  const base=.11+.89*Math.pow(1-strength,1.35);
  const alpha=Math.min(1,base+strength*Math.min(.20,travel/90));
  return {
    x:stroke.prev.x+(raw.x-stroke.prev.x)*alpha,
    y:stroke.prev.y+(raw.y-stroke.prev.y)*alpha,
    p:stroke.prev.p+(raw.p-stroke.prev.p)*Math.max(alpha,.36)
  };
}
// Finish the line where the pen actually left the canvas, without drawing
// a sudden single jump from the stabilizer's lagging position.
function finishSmoothedStroke(stroke){
  if(!stroke.stabilizerEnabled||stroke.stabilizerStrength<=0||!stroke.lastRaw)return;
  const a=stroke.prev,b=stroke.lastRaw;
  const d=Math.hypot(a.x-b.x,a.y-b.y);
  if(d<.05)return;
  const count=Math.max(2,Math.min(24,Math.ceil(d/2.5)));
  for(let i=1;i<=count;i++){
    const t=i/count,progress=t*t*(3-2*t);
    const next={x:a.x+(b.x-a.x)*progress,y:a.y+(b.y-a.y)*progress,p:a.p+(b.p-a.p)*progress};
    paintSegment(stroke.ctx,stroke.prev,next,stroke.size);
    stroke.prev=next;
  }
}
function downPaint(e){if(e.button!==0||!getCut())return;if(state.tool==='picker'){const p=pointFromEvent(e);const a=$('#renderCanvas').getContext('2d').getImageData(Math.min(CW-1,Math.floor(p.x)),Math.min(CH-1,Math.floor(p.y)),1,1).data;if(a[3]){setBrushColor('#'+[a[0],a[1],a[2]].map(v=>v.toString(16).padStart(2,'0')).join(''));state.sideTab='tools';renderRight();toast('スポイトで色を取得しました');}return;}
if(state.tool==='hand'){ui.painting={hand:true,x:e.clientX,y:e.clientY,l:$('#canvasScroll').scrollLeft,t:$('#canvasScroll').scrollTop};$('#interactionCanvas').setPointerCapture(e.pointerId);return;}
const l=layer();if(!l||!l.visible||l.locked){toast('表示中でロックされていないレイヤーを選択してください');return;}const cv=ui.layerCanvases.get(l.id);if(!cv)return;
const strokeCanvas=canvasFactory(CW,CH),ctx=strokeCanvas.getContext('2d');ctx.fillStyle=state.tool==='eraser'?'#000':state.brushColor;ctx.strokeStyle=ctx.fillStyle;ctx.lineCap='round';ctx.lineJoin='round';
const p=pointFromEvent(e);plotCircle(ctx,p.x,p.y,p.p,state.brushSize);
ui.painting={cutId:getCut().id,layerId:l.id,ctx,cv,strokeCanvas,previewCanvas:canvasFactory(CW,CH),before:cv.toDataURL('image/png'),prev:p,hand:false,eraser:state.tool==='eraser',opacity:state.brushOpacity/100,size:state.brushSize,pointerId:e.pointerId,stabilizerEnabled:state.stabilizerEnabled,stabilizerStrength:state.stabilizerStrength,lastRaw:p};
$('#interactionCanvas').setPointerCapture(e.pointerId);renderComposite();e.preventDefault();}
function movePaint(e){const v=ui.painting;if(!v)return;if(v.pointerId!==undefined&&v.pointerId!==e.pointerId)return;if(v.hand){const s=$('#canvasScroll');s.scrollLeft=v.l-(e.clientX-v.x);s.scrollTop=v.t-(e.clientY-v.y);return;}

for(const sample of samples.length?samples:[e]){
  const p=smoothStrokePoint(v,pointFromEvent(sample));
  paintSegment(v.ctx,v.prev,p,v.size);
  v.prev=p;

function upPaint(e){const v=ui.painting;if(!v)return;
if(e&&v.pointerId!==undefined&&e.pointerId!==v.pointerId)return;
ui.painting=null;if(v.hand)return;
// Include the final pointerup coordinate if it was not emitted as a move event.
if(e?.type==='pointerup'){
  const raw=pointFromEvent(e);
  if(Math.hypot(raw.x-v.lastRaw.x,raw.y-v.lastRaw.y)>.01){
    const next=smoothStrokePoint(v,raw);
    paintSegment(v.ctx,v.prev,next,v.size);
    v.prev=next;
  }

finishSmoothedStroke(v);
const ctx=v.cv.getContext('2d');ctx.save();ctx.globalCompositeOperation=v.eraser?'destination-out':'source-over';ctx.globalAlpha=v.opacity;ctx.drawImage(v.strokeCanvas,0,0);ctx.restore();
renderComposite();const after=v.cv.toDataURL('image/png');pushUndo(v.cutId,v.layerId,v.before,after);syncActive();renderLeft();if(state.sideTab==='layers')renderRight();renderCanvasInfo();markDirty();}
function setBrushColor(hex){if(!/^#[0-9a-fA-F]{6}$/.test(hex))return;state.brushColor=hex.toLowerCase();const [h,s,v]=hexToHsv(hex);ui.h=h;ui.s=s;ui.v=v;markDirty();}
function hexToHsv(hex){const v=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)/255),max=Math.max(...v),min=Math.min(...v),d=max-min;let h=0;if(d){if(max===v[0])h=60*(((v[1]-v[2])/d)%6);else if(max===v[1])h=60*((v[2]-v[0])/d+2);else h=60*((v[0]-v[1])/d+4);}return [(h+360)%360,max===0?0:d/max*100,max*100];}
function hsvToHex(h,s,v){s/=100;v/=100;const C=v*s,X=C*(1-Math.abs((h/60)%2-1)),m=v-C;let rgb=h<60?[C,X,0]:h<120?[X,C,0]:h<180?[0,C,X]:h<240?[0,X,C]:h<300?[X,0,C]:[C,0,X];return '#'+rgb.map(x=>Math.round((x+m)*255).toString(16).padStart(2,'0')).join('');}
function setupWheel(){const w=$('#colorWheel');if(!w)return;const sat=$('#satBox'),p=$('#satPoint');sat.style.background=`linear-gradient(to top,#000,transparent),linear-gradient(to right,#fff,hsl(${ui.h},100%,50%))`;p.style.left=`calc(${sat.offsetLeft}px + ${ui.s/100*sat.offsetWidth}px - 6px)`;p.style.top=`calc(${sat.offsetTop}px + ${(100-ui.v)/100*sat.offsetHeight}px - 6px)`;}
function wheelInteract(e){const wheel=$('#colorWheel');if(!wheel)return;const rect=wheel.getBoundingClientRect(),x=e.clientX-rect.left-rect.width/2,y=e.clientY-rect.top-rect.height/2,r=Math.hypot(x,y);const sat=$('#satBox');const srect=sat.getBoundingClientRect();const inSquare=e.target===sat||e.target.id==='satPoint'||(e.clientX>=srect.left&&e.clientX<=srect.right&&e.clientY>=srect.top&&e.clientY<=srect.bottom);if(inSquare){ui.s=Math.max(0,Math.min(100,100*(e.clientX-srect.left)/srect.width));ui.v=Math.max(0,Math.min(100,100*(1-(e.clientY-srect.top)/srect.height)));}else{ui.h=(Math.atan2(x,-y)*180/Math.PI+360)%360;}setBrushColor(hsvToHex(ui.h,ui.s,ui.v));if($('#colorPicker'))$('#colorPicker').value=state.brushColor;if($('#hexInput'))$('#hexInput').value=state.brushColor;setupWheel();}
function downloadBlob(name,blob){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),15000);}
function downloadText(name,text,mime='text/plain;charset=utf-8'){downloadBlob(name,new Blob([text],{type:mime}));}
function buildText(){let result=`${state.name}\n${'='.repeat(45)}\n\n`;if(state.summary.trim())result+=`【あらすじ】\n${state.summary}\n\n`;for(const [i,s]of state.scenes.entries()){result+=`【${s.title}】\n`;if(s.description)result+=`${s.description}\n`;for(const [j,c]of s.cuts.entries()){result+=`\n■ カット${j+1}（約${c.duration}秒）${c.name?' '+c.name:''}\n`;for(const b of c.blocks){const txt=scriptLine(b);if(txt)result+=txt+'\n';}}result+='\n';}result+=`\n${countText()}\n`;return result;}
function saveJson(){syncActive();downloadText(cleanFile(state.name)+'.json',JSON.stringify({...state,version:2},null,2),'application/json;charset=utf-8');toast('プロジェクトJSONを保存しました');}
function escapeHtmlDoc(s){return esc(s);}
async function exportHtml(){syncActive();const imageUrls=new Map;for(const s of state.scenes){for(const c of s.cuts){const map=new Map;await Promise.all(c.layers.map(async l=>{if(l.png){try{map.set(l.id,await imageFromData(l.png));}catch(e){console.warn(e);}}}));imageUrls.set(c.id,composite(c,map,1,true).toDataURL('image/png'));}}const sections=state.scenes.map((s,si)=>`<section><h2>${escapeHtmlDoc(s.title)}</h2>${s.description?`<p class="scene-description">${escapeHtmlDoc(s.description)}</p>`:''}${s.cuts.map((c,i)=>`<article><div class="art"><div class="cuttag">CUT ${i+1}</div><img src="${imageUrls.get(c.id)}" alt="カット${i+1}"></div><div class="writing"><div class="time">約${c.duration}秒 ${escapeHtmlDoc(c.name||'')}</div>${c.blocks.map(b=>`<p class="${b.type}">${escapeHtmlDoc(scriptLine(b)).replace(/\n/g,'<br>')}</p>`).join('')||'<p class="empty">（テキスト未入力）</p>'}</div></article>`).join('')}</section>`).join('');
const doc=`<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${escapeHtmlDoc(state.name)}｜絵コンテ</title><style>*{box-sizing:border-box}body{background:#f2e5d5;color:#37251a;font-family:"Yu Gothic",Meiryo,sans-serif;margin:0}header{background:#382217;color:#ffe8c2;padding:25px max(24px,calc((100vw - 1100px)/2))}header h1{margin:0 0 10px}main{max-width:1100px;margin:22px auto;padding:0 16px}section{margin-bottom:30px}h2{background:#553526;color:#ffe4b7;padding:10px 18px;border-radius:7px}.scene-description{color:#654837}article{display:grid;grid-template-columns:40% 1fr;gap:20px;border-radius:13px;background:#fff8ed;margin:12px 0;padding:15px;border:1px solid #d6b797;break-inside:avoid}.art{position:relative}.art img{width:100%;aspect-ratio:16/9;object-fit:contain;background:#fff;border:1px solid #c8a78b;border-radius:7px}.cuttag{position:absolute;top:0;left:0;background:#69412b;color:#ffe6bf;padding:5px 14px;border-radius:6px}.writing{white-space:normal}.writing p{margin:7px 0;line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere;font-weight:700}.writing .action{color:#7b5337}.time{border-bottom:1px solid #dac1a8;padding:4px 0 9px;color:#7b5235}.empty{color:#ab9a8b}footer{padding:30px;text-align:center;color:#72543d}@media(max-width:650px){article{grid-template-columns:1fr}}@media print{body{background:white}header{padding:12px}main{margin:5px auto}section{page-break-inside:auto}article{break-inside:avoid}h2{break-after:avoid}}</style></head><body><header><h1>${escapeHtmlDoc(state.name)}</h1><div>${escapeHtmlDoc(countText())}｜${state.scenes.length}シーン</div>${state.summary?`<p>${escapeHtmlDoc(state.summary)}</p>`:''}</header><main>${sections}</main><footer>CineScript Pro｜絵コンテ・台本書き出し</footer></body></html>`;
downloadText(cleanFile(state.name)+'_絵コンテ.html',doc,'text/html;charset=utf-8');toast('画像と台本をまとめたHTMLを出力しました');}
async function importProject(file){if(!file)return;try{const raw=JSON.parse(await file.text());if(!raw||!Array.isArray(raw.scenes)||!raw.scenes.length)throw Error('シーンデータがありません');if(!raw.scenes.every(s=>Array.isArray(s.cuts)&&s.cuts.length&&s.cuts.every(c=>Array.isArray(c.layers)&&c.layers.length&&c.layers.length<=10&&Array.isArray(c.blocks))))throw Error('カットまたはレイヤーデータに問題があります');syncActive();state={...newProject(),...raw,id:uid(),mode:'story',sideTab:'input'};state.activeSceneId=state.scenes.some(s=>s.id===raw.activeSceneId)?raw.activeSceneId:state.scenes[0].id;const first=getScene().cuts[0];state.activeCutId=getScene().cuts.some(c=>c.id===raw.activeCutId)?raw.activeCutId:first.id;state.selectedLayerId=getCut().layers[0].id;ui.undo=[];ui.redo=[];ui.editBlockId=null;localStorage.setItem('cinescript_current',state.id);renderAll();await loadActiveCanvases();await saveLocal();toast('JSONプロジェクトを読み込みました');}catch(e){alert('JSONの読み込みに失敗しました。\n'+e.message);}}
function closeModal(){$('#modalShade').classList.remove('open');}
function showModal(html){$('#modalContent').innerHTML=html;$('#modalShade').classList.add('open');}
function promptModal(title,content,buttons){showModal(`<h2>${title}</h2>${content}<div class="modal-actions">${buttons}</div>`);}
function characterModal(id=null){const c=state.characters.find(x=>x.id===id);promptModal(c?'キャラクターを編集':'キャラクターを登録',`<div class="field"><label>キャラクター名</label><input type="text" id="charName" maxlength="80" value="${esc(c?.name||'')}" placeholder="例：こはる" autofocus></div><div class="field"><label>イメージカラー</label><input type="color" id="charColor" value="${esc(c?.color||'#e9baa5')}"></div><div class="info">名前を変更すると既存の台詞のキャラクター名も更新されます。</div>`,`<button class="btn" data-action="closeModal">キャンセル</button><button class="btn primary" data-action="saveCharacter" data-id="${id||''}">保存</button>`);$('#charName')?.focus();}
function layerModal(id){const l=getCut().layers.find(l=>l.id===id);if(!l)return;promptModal('レイヤー操作',`<div class="field"><label>レイヤー名</label><input type="text" id="layerName" value="${esc(l.name)}" maxlength="70"></div><div class="info">レイヤーの描画内容もJSON・PSDに保存されます。</div>`,`<button class="btn danger" data-action="deleteLayer" data-id="${id}">削除</button><button class="btn" data-action="clearLayer" data-id="${id}">描画を消去</button><button class="btn primary" data-action="saveLayerName" data-id="${id}">名前を保存</button>`);}
function cutModal(id){const c=findCutById(id)?.cut;if(!c)return;promptModal('カットの操作',`<p>「${esc(c.name||sceneCutName(getScene(),c))}」</p><div class="info">カットを複製すると、画像レイヤー・台詞・ト書きがすべて複製されます。</div>`,`<button class="btn" data-action="closeModal">戻る</button><button class="btn danger" data-action="deleteCutById" data-id="${id}">削除</button><button class="btn primary" data-action="duplicateCutById" data-id="${id}">複製</button>`);}
function sceneModal(id){const s=state.scenes.find(x=>x.id===id);if(!s)return;promptModal('シーンの編集',`<div class="field"><label>シーン名</label><input id="modalSceneName" type="text" value="${esc(s.title)}"></div><div class="field"><label>プロット</label><textarea id="modalSceneDesc" class="dark-input" style="min-height:100px">${esc(s.description)}</textarea></div>`,`<button class="btn danger" data-action="deleteSceneById" data-id="${id}">シーン削除</button><button class="btn primary" data-action="saveSceneModal" data-id="${id}">保存</button>`);}
async function addCut(){syncActive();const sc=getScene(),c=makeCut();sc.cuts.push(c);await selectCut(c.id);markDirty();}
async function addScene(){syncActive();const sc=makeScene(state.scenes.length+1);state.scenes.push(sc);await selectCut(sc.cuts[0].id);markDirty();}
async function deleteCutById(id){const found=findCutById(id);if(!found)return;const s=found.scene;if(s.cuts.length===1){toast('各シーンには最低1カット必要です');return;}if(!confirm('このカットと描画データを削除しますか？'))return;syncActive();s.cuts=s.cuts.filter(c=>c.id!==id);closeModal();await selectCut(s.cuts[Math.max(0,Math.min(s.cuts.length-1,found.index||0))].id);markDirty();}
async function deleteSceneById(id){if(state.scenes.length<=1){toast('シーンは最低1つ必要です');return;}if(!confirm('このシーンのカットもすべて削除しますか？'))return;syncActive();state.scenes=state.scenes.filter(s=>s.id!==id);closeModal();await selectCut(state.scenes[0].cuts[0].id);markDirty();}
async function duplicateCut(id){syncActive();const found=findCutById(id);if(!found)return;const raw=structuredClone(found.cut);raw.id=uid();raw.blocks.forEach(x=>x.id=uid());raw.layers.forEach(x=>x.id=uid());found.scene.cuts.splice(found.scene.cuts.indexOf(found.cut)+1,0,raw);closeModal();await selectCut(raw.id);toast('カットを複製しました');}
function switchSide(v){state.sideTab=v;renderRight();markDirty();}
function reorderCut(source,target){if(source===target)return;const a=findCutById(source),b=findCutById(target);if(!a||!b)return;syncActive();a.scene.cuts=a.scene.cuts.filter(c=>c.id!==a.cut.id);const idx=b.scene.cuts.findIndex(c=>c.id===b.cut.id);b.scene.cuts.splice(idx,0,a.cut);state.activeSceneId=b.scene.id;renderAll();markDirty();}
function reorderBlock(sourceId,targetId,where='before'){
 const cut=getCut();
 if(!cut||sourceId===targetId)return;
 const sourceIndex=cut.blocks.findIndex(b=>b.id===sourceId);
 if(sourceIndex<0||!cut.blocks.some(b=>b.id===targetId))return;
 const [block]=cut.blocks.splice(sourceIndex,1);
 const targetIndex=cut.blocks.findIndex(b=>b.id===targetId);
 cut.blocks.splice(targetIndex+(where==='after'?1:0),0,block);
 renderRight();renderStoryboard();renderCanvasInfo();markDirty();
}
function clearBlockDragHint(){document.querySelectorAll('.block-drag-before,.block-drag-after').forEach(el=>el.classList.remove('block-drag-before','block-drag-after'));}

async function handleAction(target){const act=target.dataset.action,id=target.dataset.id,v=target.dataset.value;const c=getCut();switch(act){
case 'openHome':await openHome();break;
case 'storyMode':await changeMode('story');break;case 'canvasMode':await changeMode('canvas');break;
case 'zoomOut':state.zoom=Math.max(25,state.zoom-10);updateStageSize();markDirty();break;case 'zoomIn':state.zoom=Math.min(160,state.zoom+10);updateStageSize();markDirty();break;
case 'fitCanvas':{const area=$('#canvasScroll');const size=Math.min((area.clientWidth-48)/CW,(area.clientHeight-48)/CH,1.5);state.zoom=Math.max(25,Math.min(160,Math.floor(size*100/5)*5));updateStageSize();markDirty();break;}
case 'undo':await historyStep(false);break;case 'redo':await historyStep(true);break;
case 'saveJson':saveJson();break;case 'loadJson':$('#projectFile').click();break;
case 'exportHtml':await exportHtml();break;case 'exportTxt':syncActive();downloadText(cleanFile(state.name)+'_台本.txt',buildText());toast('台本テキストを出力しました');break;
case 'exportPsd':await exportPsdZip();break;
case 'toggleScene':ui.collapsedScenes.has(id)?ui.collapsedScenes.delete(id):ui.collapsedScenes.add(id);renderLeft();break;
case 'chooseScene':await selectScene(id);break;case 'sceneOptions':sceneModal(id);break;
case 'addScene':await addScene();break;case 'addCut':await addCut();break;case 'selectCut':await selectCut(id);break;case 'openCanvas':await selectCut(id,'canvas');state.sideTab='layers';renderRight();break;case 'openScript':await selectCut(id,'story');switchSide('input');break;case 'cutOptions':cutModal(id);break;
case 'sideTab':switchSide(v);break;case 'showInput':switchSide('input');break;
case 'prevCut':case 'nextCut':{const s=getScene(),idx=s.cuts.indexOf(getCut())+(act==='prevCut'?-1:1);if(s.cuts[idx])await selectCut(s.cuts[idx].id);break;}
case 'tool':state.tool=v;renderTools();if(state.sideTab==='tools')renderRight();markDirty();break;
case 'addLayer':if(c.layers.length>=10){toast('レイヤーは最大10枚までです');break;}syncActive();{const l=makeLayer('レイヤー'+(c.layers.length+1));c.layers.unshift(l);state.selectedLayerId=l.id;ui.layerCanvases.set(l.id,canvasFactory());renderRight();renderComposite();markDirty();}break;
case 'selectLayer':state.selectedLayerId=id;renderRight();markDirty();break;
case 'toggleLayer':{syncActive();const l=c.layers.find(l=>l.id===id);if(l){l.visible=!l.visible;renderComposite();syncActive();renderLeft();if(state.mode==='story')renderStoryboard();renderRight();markDirty();}break;}
case 'toggleLock':{const l=c.layers.find(l=>l.id===id);if(l){l.locked=!l.locked;renderRight();markDirty();}break;}
case 'layerMenu':layerModal(id);break;
case 'moveLayerUp':case 'moveLayerDown':{const i=c.layers.findIndex(l=>l.id===state.selectedLayerId);const j=i+(act==='moveLayerUp'?-1:1);if(j>=0&&j<c.layers.length){[c.layers[i],c.layers[j]]=[c.layers[j],c.layers[i]];renderComposite();syncActive();renderLeft();renderRight();markDirty();}break;}
case 'deleteLayer':{const l=c.layers.find(l=>l.id===id);if(c.layers.length===1){toast('最低1枚のレイヤーが必要です');break;}if(!confirm('このレイヤーを削除しますか？'))break;syncActive();c.layers=c.layers.filter(l=>l.id!==id);ui.layerCanvases.delete(id);if(state.selectedLayerId===id)state.selectedLayerId=c.layers[0].id;closeModal();renderComposite();syncActive();renderLeft();renderRight();markDirty();break;}
case 'clearLayer':{const l=c.layers.find(l=>l.id===id);if(!l||l.locked){toast('ロックされたレイヤーは消去できません');break;}const cv=ui.layerCanvases.get(id);if(cv){const before=cv.toDataURL('image/png');cv.getContext('2d').clearRect(0,0,CW,CH);pushUndo(c.id,id,before,cv.toDataURL('image/png'));syncActive();renderComposite();renderLeft();}closeModal();renderRight();markDirty();break;}
case 'saveLayerName':{const l=c.layers.find(l=>l.id===id);if(l)l.name=$('#layerName').value.trim()||l.name;closeModal();renderRight();markDirty();break;}
case 'insertBlock':{const text=ui.draftText.trim().replace(ui.draftType==='action'?/^\/\/\s*/:/^$/, '');if(!text){toast('テキストを入力してください');break;}if(ui.draftType==='dialogue'&&!state.characters.length){toast('キャラクターを登録してください');break;}const existing=c.blocks.find(b=>b.id===ui.editBlockId);if(existing){existing.type=ui.draftType;existing.text=text;existing.characterId=ui.draftType==='dialogue'?ui.selectedCharId||state.characters[0].id:null;}else{const block={id:uid(),type:ui.draftType,characterId:ui.draftType==='dialogue'?ui.selectedCharId||state.characters[0].id:null,text};const anchorIndex=c.blocks.findIndex(b=>b.id===ui.insertAnchorId);if(anchorIndex<0)c.blocks.push(block);else c.blocks.splice(anchorIndex+(ui.insertWhere==='after'?1:0),0,block);}ui.draftText='';ui.editBlockId=null;renderRight();renderStoryboard();renderCanvasInfo();updateStats();markDirty();toast(existing?'テキストを更新しました':'テキストを追加しました');break;}
case 'setInsertPosition':{if(!c.blocks.some(b=>b.id===id))break;if(ui.insertAnchorId===id&&ui.insertWhere===v){ui.insertAnchorId=null;ui.insertWhere=null;}else{ui.insertAnchorId=id;ui.insertWhere=v;}renderRight();break;}
case 'editBlock':{const b=c.blocks.find(x=>x.id===id);if(b){ui.draftType=b.type;ui.draftText=b.text;ui.editBlockId=id;ui.selectedCharId=b.characterId;renderRight();$('#composer')?.focus();}break;}
case 'deleteBlock':{c.blocks=c.blocks.filter(b=>b.id!==id);if(ui.editBlockId===id){ui.draftText='';ui.editBlockId=null;}if(ui.insertAnchorId===id){ui.insertAnchorId=null;ui.insertWhere=null;}renderRight();renderStoryboard();renderCanvasInfo();updateStats();markDirty();break;}
case 'cancelEdit':ui.draftText='';ui.editBlockId=null;renderRight();break;
case 'addCharacter':characterModal();break;case 'editCharacter':characterModal(id);break;
case 'saveCharacter':{const name=$('#charName').value.trim(),color=$('#charColor').value;if(!name){toast('キャラクター名を入力してください');break;}const existing=state.characters.find(c=>c.id===id);if(existing){existing.name=name;existing.color=color;}else{const fresh={id:uid(),name,color};state.characters.push(fresh);ui.selectedCharId=fresh.id;}closeModal();renderAll();markDirty();break;}
case 'removeCharacter':{if(!confirm('キャラクターを削除しますか？既存台詞は残りますが話者が未登録表示になります。'))break;state.characters=state.characters.filter(c=>c.id!==id);if(ui.selectedCharId===id)ui.selectedCharId=state.characters[0]?.id;renderAll();markDirty();break;}
case 'paletteColor':setBrushColor(v);renderRight();break;
case 'importImage':$('#imageFile').click();break;
case 'duplicateCut':await duplicateCut(c.id);break;case 'duplicateCutById':await duplicateCut(id);break;
case 'deleteCut':await deleteCutById(c.id);break;case 'deleteCutById':await deleteCutById(id);break;
case 'deleteScene':await deleteSceneById(getScene().id);break;case 'deleteSceneById':await deleteSceneById(id);break;
case 'saveSceneModal':{const s=state.scenes.find(s=>s.id===id);if(s){s.title=$('#modalSceneName').value.trim()||s.title;s.description=$('#modalSceneDesc').value;}closeModal();renderAll();markDirty();break;}
case 'closeModal':closeModal();break;
case 'newProject':{syncActive();await saveLocal();state=newProject();ui.layerCanvases=new Map();ui.undo=[];ui.redo=[];ui.editBlockId=null;ui.insertAnchorId=null;ui.insertWhere=null;ui.selectedCharId=null;localStorage.setItem('cinescript_current',state.id);closeModal();renderAll();await loadActiveCanvases();await saveLocal();toast('新しいプロジェクトを作成しました');break;}
case 'loadLocal':await loadLocal(id);closeModal();break;
case 'deleteLocal':if(confirm('この保存プロジェクトをブラウザから削除しますか？')){await dbDelete(id);await openHome();}break;
}}
function handleInput(e){const t=e.target;const id=t.id;switch(id){case 'projectName':state.name=t.value;markDirty();break;case 'summaryInput':state.summary=t.value;markDirty();break;case 'memoInput':state.notes=t.value;markDirty();break;case 'composer':ui.draftText=t.value;break;case 'brushSize':state.brushSize=Number(t.value);$('#brushSizeLabel').textContent=t.value+' px';markDirty();break;case 'brushOpacity':state.brushOpacity=Number(t.value);$('#opacityLabel').textContent=t.value+' %';markDirty();break;
case 'stabilizerSlider':state.stabilizerStrength=Math.max(0,Math.min(100,Number(t.value)));$('#stabilizerLabel').textContent=state.stabilizerStrength+'%';markDirty();break;
case 'stabilizerCheck':state.stabilizerEnabled=t.checked;$('#stabilizerSlider').disabled=!t.checked;markDirty();break;case 'colorPicker':setBrushColor(t.value);renderRight();break;case 'hexInput':if(/^#[0-9a-fA-F]{6}$/.test(t.value))setBrushColor(t.value);break;case 'zoomSlider':state.zoom=Number(t.value);updateStageSize();markDirty();break;case 'pressureCheck':state.pressure=t.checked;markDirty();break;case 'sceneTitleInput':getScene().title=t.value;renderLeft();renderHeader();markDirty();break;case 'sceneDescInput':getScene().description=t.value;renderLeft();markDirty();break;case 'cutTitleInput':getCut().name=t.value;renderStoryboard();markDirty();break;case 'cutDurationInput':getCut().duration=Math.max(1,Number(t.value)||1);renderStoryboard();renderLeft();markDirty();break;}}
function handleChange(e){const t=e.target;if(t.id==='sceneSelect'){selectScene(t.value);return;}if(t.name==='scriptType'){ui.draftType=t.value;ui.editBlockId=null;ui.draftText='';renderRight();return;}if(t.name==='speaker'){ui.selectedCharId=t.value;return;}}
// Project persistence: IndexedDB keeps large raster image data out of localStorage quotas.
function getDb(){return new Promise((res,rej)=>{const r=indexedDB.open('CineScriptPro_Projects',1);r.onupgradeneeded=()=>r.result.createObjectStore('projects',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
function dbPut(project){return new Promise((res,rej)=>{const tx=ui.db.transaction('projects','readwrite');tx.objectStore('projects').put(project);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});}
function dbGet(id){return new Promise((res,rej)=>{const r=ui.db.transaction('projects').objectStore('projects').get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
function dbAll(){return new Promise((res,rej)=>{const r=ui.db.transaction('projects').objectStore('projects').getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
function dbDelete(id){return new Promise((res,rej)=>{const tx=ui.db.transaction('projects','readwrite');tx.objectStore('projects').delete(id);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});}
async function saveLocal(){if(!ui.db)return;try{syncActive();localStorage.setItem('cinescript_current',state.id);await dbPut(structuredClone(state));$('#saveStatus').textContent='✓ 自動保存済み';}catch(e){console.error(e);$('#saveStatus').textContent='⚠ 自動保存に失敗';toast('容量不足の可能性があります。JSON保存でバックアップしてください');}}
async function loadLocal(id){const found=await dbGet(id);if(!found)return toast('プロジェクトが見つかりません');syncActive();state={...newProject(),...found};state.scenes=found.scenes;state.activeSceneId=state.scenes.some(s=>s.id===state.activeSceneId)?state.activeSceneId:state.scenes[0].id;state.activeCutId=getScene().cuts.some(c=>c.id===state.activeCutId)?state.activeCutId:getScene().cuts[0].id;state.selectedLayerId=getCut().layers.find(l=>l.id===state.selectedLayerId)?.id||getCut().layers[0].id;ui.undo=[];ui.redo=[];ui.editBlockId=null;ui.draftText='';ui.insertAnchorId=null;ui.insertWhere=null;ui.selectedCharId=state.characters[0]?.id||null;ui.activeLoadedCut=null;localStorage.setItem('cinescript_current',state.id);renderAll();await loadActiveCanvases();toast('保存済みプロジェクトを開きました');}
async function openHome(){const all=await dbAll();all.sort((a,b)=>String(b.updatedAt).localeCompare(String(a.updatedAt)));showModal(`<h2>📁 プロジェクト</h2><div class="info">このブラウザ内の自動保存データです。ほかの端末への移動にはJSON保存をご利用ください。</div>${all.map(p=>`<div class="project-entry"><span><b>${esc(p.name)}</b><small>${p.scenes?.length||0}シーン / 最終更新 ${esc(String(p.updatedAt||'').slice(0,16).replace('T',' '))}</small></span><span class="flexrow"><button class="btn mini ${p.id===state.id?'active':''}" data-action="loadLocal" data-id="${p.id}">開く</button><button class="btn mini danger" data-action="deleteLocal" data-id="${p.id}">削除</button></span></div>`).join('')||'<div class="empty-state">保存したプロジェクトはありません。</div>'}<div class="modal-actions"><button class="btn" data-action="closeModal">閉じる</button><button class="btn primary" data-action="newProject">＋ 新規プロジェクト</button></div>`);}
async function addImportedImage(file){if(!file)return;const l=layer();if(!l||l.locked){toast('ロックされていないレイヤーを選択してください');return;}try{const url=URL.createObjectURL(file);const img=await imageFromData(url);URL.revokeObjectURL(url);const cv=ui.layerCanvases.get(l.id),before=cv.toDataURL('image/png'),ctx=cv.getContext('2d');const scale=Math.min(CW/img.width,CH/img.height);ctx.drawImage(img,(CW-img.width*scale)/2,(CH-img.height*scale)/2,img.width*scale,img.height*scale);pushUndo(getCut().id,l.id,before,cv.toDataURL('image/png'));syncActive();renderComposite();renderAll();markDirty();toast('画像をレイヤーに読み込みました');}catch(e){alert('画像読み込みに失敗しました：'+e.message);}}
// Binary PSD / ZIP writers are implemented below: offline-capable, no CDN dependencies.
</script>
<script>
/* PSD and ZIP exporters (no external libraries). The text is rasterized into a separate Photoshop layer. */
class Bytes{constructor(){this.arr=[];this.length=0;}bytes(a){if(a instanceof Bytes)a=a.build();if(!(a instanceof Uint8Array))a=new Uint8Array(a);this.arr.push(a);this.length+=a.length;return this;}u8(n){return this.bytes(Uint8Array.of(n&255));}u16(n){return this.bytes(Uint8Array.of((n>>>8)&255,n&255));}s16(n){return this.u16(n<0?65536+n:n);}u32(n){return this.bytes(Uint8Array.of((n>>>24)&255,(n>>>16)&255,(n>>>8)&255,n&255));}le16(n){return this.bytes(Uint8Array.of(n&255,(n>>>8)&255));}le32(n){return this.bytes(Uint8Array.of(n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255));}ascii(s){return this.bytes(Uint8Array.from(s,c=>c.charCodeAt(0)&255));}build(){const out=new Uint8Array(this.length);let n=0;for(const a of this.arr){out.set(a,n);n+=a.length;}return out;}}
function packBits(bytes){const w=new Bytes;let i=0;while(i<bytes.length){let run=1;while(i+run<bytes.length&&bytes[i+run]===bytes[i]&&run<128)run++;if(run>=3){w.u8(257-run).u8(bytes[i]);i+=run;}else{const start=i;i+=run;while(i<bytes.length&&i-start<128){let r=1;while(i+r<bytes.length&&bytes[i+r]===bytes[i]&&r<128)r++;if(r>=3)break;i+=Math.min(r,128-(i-start));}w.u8(i-start-1).bytes(bytes.slice(start,i));}}return w.build();}
function psdRLE(imageData,w,h,channel){const lengths=new Bytes,body=new Bytes;const raw=imageData.data,row=new Uint8Array(w);for(let y=0;y<h;y++){for(let x=0;x<w;x++)row[x]=raw[(y*w+x)*4+channel];const enc=packBits(row);if(enc.length>65535)throw Error('PSD行が長すぎます');lengths.u16(enc.length);body.bytes(enc);}return {bytes:new Bytes().u16(1).bytes(lengths).bytes(body).build()};}
function unicodeName(name){const w=new Bytes;w.u32(name.length);for(let i=0;i<name.length;i++)w.u16(name.charCodeAt(i));return w.build();}
function psdPascalName(name){let ascii=Array.from(name).map(x=>x.charCodeAt(0)<32||x.charCodeAt(0)>126?'_':x).join('').slice(0,255);const w=new Bytes;w.u8(ascii.length).ascii(ascii);while(w.length%4)w.u8(0);return w.build();}
function psdLayerRecord(layer,rleData,w,h){const rec=new Bytes;rec.u32(0).u32(0).u32(h).u32(w).u16(4);for(let ch=0;ch<4;ch++)rec.s16(ch===3?-1:ch).u32(rleData[ch].bytes.length);rec.ascii('8BIMnorm').u8(255).u8(0).u8(layer.visible===false?2:0).u8(0);const extras=new Bytes,pass=psdPascalName(layer.name),uni=unicodeName(layer.name);extras.u32(0).u32(0).bytes(pass);extras.ascii('8BIMluni').u32(uni.length).bytes(uni);if(uni.length%2)extras.u8(0);rec.u32(extras.length).bytes(extras);return rec.build();}
function makeTextLayer(cut,scene,number,w,h){const cv=canvasFactory(w,h);const ctx=cv.getContext('2d');ctx.fillStyle='#40271b';ctx.font='bold 20px sans-serif';ctx.fillText(`${scene.title} / カット${number}`,30,CH+40);let ypos=CH+76;ctx.font='16px sans-serif';for(const block of cut.blocks){const txt=scriptLine(block);for(const line of txt.split('\n')){if(ypos>h-12)break;const maxLen=49;const chars=Array.from(line);for(let start=0;start<chars.length;start+=maxLen){if(ypos>h-12)break;ctx.fillStyle=block.type==='action'?'#83654c':'#38251a';ctx.fillText(chars.slice(start,start+maxLen).join(''),32,ypos);ypos+=23;}}}return cv;}
function psdForCut(cut,scene,index,canvasLayers){const lineCount=cut.blocks.reduce((sum,b)=>sum+String(scriptLine(b)).split('\n').reduce((n,line)=>n+Math.max(1,Math.ceil(Array.from(line).length/49)),0),0);const h=CH+Math.max(280,lineCount*23+105),w=CW,background=canvasFactory(w,h),bgCtx=background.getContext('2d');bgCtx.fillStyle='#fff9ef';bgCtx.fillRect(0,0,w,h);const textCanvas=makeTextLayer(cut,scene,index,w,h);const layers=[{name:'SCRIPT - 台詞とト書き',canvas:textCanvas},...cut.layers.map(l=>({name:l.name+(l.visible?'':' (hidden)'),canvas:canvasLayers.get(l.id),visible:l.visible})),{name:'PAPER - 背景',canvas:background}];const records=new Bytes,pixels=new Bytes;for(const l of layers){const data=l.canvas.getContext('2d').getImageData(0,0,w,h),rle=[0,1,2,3].map(ch=>psdRLE(data,w,h,ch));records.bytes(psdLayerRecord(l,rle,w,h));for(let ch=0;ch<4;ch++)pixels.bytes(rle[ch].bytes);}const li=new Bytes;li.s16(layers.length).bytes(records).bytes(pixels);if(li.length%2)li.u8(0);const section=new Bytes;section.u32(li.length).bytes(li).u32(0);const flat=canvasFactory(w,h),ctx=flat.getContext('2d');ctx.drawImage(background,0,0);for(const l of [...cut.layers].reverse()){if(l.visible){const c=canvasLayers.get(l.id);if(c)ctx.drawImage(c,0,0);}}ctx.drawImage(textCanvas,0,0);const merged=ctx.getImageData(0,0,w,h),mergedBytes=[0,1,2,3].map(ch=>psdRLE(merged,w,h,ch).bytes);const out=new Bytes;out.ascii('8BPS').u16(1).bytes(new Uint8Array(6)).u16(4).u32(h).u32(w).u16(8).u16(3).u32(0).u32(0).u32(section.length).bytes(section);out.u16(1);for(const b of mergedBytes)out.bytes(b.subarray(2,2+h*2));for(const b of mergedBytes)out.bytes(b.subarray(2+h*2));return out.build();}
function crc32(arr){let c=-1;for(const b of arr){c^=b;for(let j=0;j<8;j++)c=(c>>>1)^((c&1)?0xedb88320:0);}return (c^-1)>>>0;}
function zipFiles(files){const local=new Bytes,center=new Bytes;let offset=0;const encoder=new TextEncoder;for(const file of files){const name=encoder.encode(file.name),data=file.bytes,crc=crc32(data);const lh=new Bytes;lh.ascii('PK\x03\x04').le16(20).le16(2048).le16(0).le16(0).le16(0).le32(crc).le32(data.length).le32(data.length).le16(name.length).le16(0).bytes(name).bytes(data);local.bytes(lh);const cd=new Bytes;cd.ascii('PK\x01\x02').le16(20).le16(20).le16(2048).le16(0).le16(0).le16(0).le32(crc).le32(data.length).le32(data.length).le16(name.length).le16(0).le16(0).le16(0).le16(0).le32(0).le32(offset).bytes(name);center.bytes(cd);offset+=lh.length;}const end=new Bytes;end.ascii('PK\x05\x06').le16(0).le16(0).le16(files.length).le16(files.length).le32(center.length).le32(local.length).le16(0);return new Bytes().bytes(local).bytes(center).bytes(end).build();}
async function exportPsdZip(){syncActive();if(!confirm('全カットをレイヤー付きPSDにしてZIP形式で書き出します。台詞・ト書きは各PSDの「SCRIPT」ラスターレイヤーになります。続行しますか？'))return;$('#saveStatus').textContent='PSD書き出し中…';await new Promise(r=>setTimeout(r,30));try{const files=[];const encoder=new TextEncoder;for(const [si,sc]of state.scenes.entries())for(const [ci,cut]of sc.cuts.entries()){const m=new Map;await Promise.all(cut.layers.map(async l=>{const cv=canvasFactory();if(l.png){try{cv.getContext('2d').drawImage(await imageFromData(l.png),0,0,CW,CH);}catch(e){console.error(e);}}m.set(l.id,cv);}));const bytes=psdForCut(cut,sc,ci+1,m);files.push({name:`scene_${String(si+1).padStart(2,'0')}_cut_${String(ci+1).padStart(3,'0')}.psd`,bytes});await new Promise(r=>setTimeout(r,0));}files.push({name:'script.txt',bytes:encoder.encode(buildText())});files.push({name:'README.txt',bytes:encoder.encode('CineScript Pro PSD export\r\nEach cut is one PSD file with raster layers, a PAPER background, and a SCRIPT raster layer.\r\nThe Japanese script text is also included in script.txt and project JSON can be saved separately.\r\nPSD size: 960 px wide; height expands according to script length.\r\n')});const zip=zipFiles(files);downloadBlob(cleanFile(state.name)+'_PSDセット.zip',new Blob([zip],{type:'application/zip'}));toast(`PSD ${files.length-2}カットをZIPに書き出しました`);}catch(e){console.error(e);alert('PSD書き出しエラー：'+e.message);}finally{$('#saveStatus').textContent='✓ 自動保存済み';}}
// Event delegation and app startup
window.addEventListener('DOMContentLoaded',async()=>{document.body.addEventListener('click',async e=>{const t=e.target.closest('[data-action]');if(t){e.preventDefault();e.stopPropagation();await handleAction(t);}});document.body.addEventListener('input',handleInput);document.body.addEventListener('change',handleChange);$('#projectFile').addEventListener('change',async e=>{await importProject(e.target.files[0]);e.target.value='';});$('#imageFile').addEventListener('change',async e=>{await addImportedImage(e.target.files[0]);e.target.value='';});$('#interactionCanvas').addEventListener('pointerdown',downPaint);$('#interactionCanvas').addEventListener('pointermove',movePaint);$('#interactionCanvas').addEventListener('pointerup',upPaint);$('#interactionCanvas').addEventListener('pointercancel',upPaint);$('#interactionCanvas').addEventListener('lostpointercapture',upPaint);
$('#modalShade').addEventListener('click',e=>{if(e.target.id==='modalShade')closeModal();});document.addEventListener('keydown',async e=>{const textFocus=['TEXTAREA','INPUT','SELECT'].includes(document.activeElement?.tagName);if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();saveJson();}else if(!textFocus&&(e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();await historyStep(e.shiftKey);}else if(!textFocus&&(e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();await historyStep(true);}else if(e.key==='Escape')closeModal();});document.addEventListener('dragstart',e=>{
 const handle=e.target.closest('[data-block-drag]');
 if(handle){ui.blockDragId=handle.dataset.blockDrag;ui.dragId=null;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',ui.blockDragId);return;}
 const src=e.target.closest('[data-cut]');if(src){ui.dragId=src.dataset.cut;ui.blockDragId=null;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',ui.dragId);}
});
document.addEventListener('dragover',e=>{
 if(ui.blockDragId){const target=e.target.closest('.block-item[data-block]');if(!target||!target.closest('#rightBody')){clearBlockDragHint();return;}
 e.preventDefault();e.dataTransfer.dropEffect='move';clearBlockDragHint();const mid=target.getBoundingClientRect().top+target.getBoundingClientRect().height/2;target.classList.add(e.clientY<mid?'block-drag-before':'block-drag-after');return;}
 if(e.target.closest('[data-cut]'))e.preventDefault();
});
document.addEventListener('drop',e=>{
 if(ui.blockDragId){const dst=e.target.closest('.block-item[data-block]');if(dst&&dst.closest('#rightBody')){e.preventDefault();const mid=dst.getBoundingClientRect().top+dst.getBoundingClientRect().height/2;reorderBlock(ui.blockDragId,dst.dataset.block,e.clientY<mid?'before':'after');}ui.blockDragId=null;clearBlockDragHint();return;}
 const dst=e.target.closest('[data-cut]');if(dst&&ui.dragId){e.preventDefault();reorderCut(ui.dragId,dst.dataset.cut);ui.dragId=null;}
});
document.addEventListener('dragend',()=>{ui.blockDragId=null;ui.dragId=null;clearBlockDragHint();});
// Continuous hue/saturation drag interaction.
let wheelDrag=false;document.body.addEventListener('pointerdown',e=>{if(e.target.closest('#colorWheel')){wheelDrag=true;wheelInteract(e);e.preventDefault();}});window.addEventListener('pointermove',e=>{if(wheelDrag)wheelInteract(e);});window.addEventListener('pointerup',()=>wheelDrag=false);
try{ui.db=await getDb();const last=localStorage.getItem('cinescript_current');if(last&&await dbGet(last)){await loadLocal(last);}else{renderAll();await loadActiveCanvases();await saveLocal();}}catch(e){console.warn('IndexedDB unavailable',e);renderAll();await loadActiveCanvases();$('#saveStatus').textContent='JSON保存をご利用ください';toast('ブラウザ保存が利用できません。JSON保存をご利用ください');}
});
